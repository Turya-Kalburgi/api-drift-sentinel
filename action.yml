name: 'API Drift Sentinel'
description: 'Detects breaking OpenAPI/Swagger contract changes in Pull Requests and blocks merges.'
author: 'Turya Kalburgi'
inputs:
  base-spec:
    description: 'Path to baseline OpenAPI file (e.g., origin/main version)'
    required: true
    default: 'openapi.json'
  head-spec:
    description: 'Path to current PR OpenAPI file'
    required: true
    default: 'openapi.json'
  github-token:
    description: 'GitHub token to post PR comments'
    required: false
    default: ''
  sentinel-token:
    description: 'API key for Sentinel Cloud Dashboard (optional)'
    required: false
    default: ''
  sentinel-endpoint:
    description: 'Webhook URL for Sentinel Cloud Dashboard ingestion'
    required: false
    default: 'https://api.drift-sentinel.com/api/v1/events'
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'shield'
  color: 'red'
